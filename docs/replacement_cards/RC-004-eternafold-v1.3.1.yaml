card_id: "RC-004-ETERNAFOLD-1.3.1-BSD3"
component_id: "eternafold_bpp_engine"
approved_software_version: "1.3.1"
approved_artifact_digests:
  v1.3.1.tar.gz: "8aa00b81b6068bff02954ef1621e7aa92f48aadcb3e89b322af46433553691b5"
  LICENSE: "8431990ae8dd84812802a5ef3d7cfe05d90257c96ed740c6e6f04ff32bc22afc"
  parameters/EternaFoldParams.v1: "1421e89cc8df24b53a320eff6c72b8acfdb2771faba29ab9c798f7bdfc853a8a"
component_name_and_version: "EternaFold 1.3.1"
role_in_pipeline: >
  Permissive BSD-3-Clause base-pair probability and unpaired accessibility engine (Wayment-Steele et al., Nature Methods 2022,
  https://github.com/WaymentSteeleLab/EternaFold/releases/tag/v1.3.1). Evaluates zero-royalty commercial_clean secondary-structure
  unpaired posteriors without linking to or invoking ViennaRNA (verified via ldd: zero libRNA linkage). Because EternaFoldParams.v1
  multi-task chemical-probing posteriors improve empirical 1M7/SHAPE-MaP rank correlation over Turner thermodynamic McCaskill while
  exhibiting a systematic posterior scale offset on short Kozak windows (MAE=0.1167 vs ViennaRNA), unmodified secondary-structure
  scoring uses EternaFold rank/reactivity mode alongside MIT structRFM (RC-002) for modified m1Psi/5moU chemistries.
current_license_track: "commercial_clean"
code_rights_basis: >
  Official release tag v1.3.1 (https://github.com/WaymentSteeleLab/EternaFold/releases/tag/v1.3.1, tarball SHA-256
  8aa00b81b6068bff02954ef1621e7aa92f48aadcb3e89b322af46433553691b5) is licensed under the 3-Clause BSD License (LICENSE SHA-256
  8431990ae8dd84812802a5ef3d7cfe05d90257c96ed740c6e6f04ff32bc22afc, Copyright Stanford University / Das Lab & CONTRAfold contributors).
  Retain copyright notice, conditions list, and disclaimer in distributions.
weights_rights_basis: >
  Bundled parameter file parameters/EternaFoldParams.v1 (SHA-256 1421e89cc8df24b53a320eff6c72b8acfdb2771faba29ab9c798f7bdfc853a8a)
  is distributed inside the same BSD-3-Clause v1.3.1 release archive with zero separate non-commercial restriction.
training_and_parameter_data_rights_basis: >
  Multi-task parameter training in Wayment-Steele et al. 2022 used public Stanford RMDB / Eterna chemical mapping datasets
  (CC0-1.0 / open scientific benchmark). mRNAx validation used RMDB ETERNA_R69_0000.rdat (CC0-1.0, SHA-256
  ed7e5716e497f68aed4dd1d7d73b18b700c911f220e24d4c1b4051769eed40c2) and NCBI GEO GSE139176 (Mauger et al. 2019, CC-BY-4.0 PMC6883848).
runtime_dependency_rights_basis: >
  Standalone C++11 contrafold binary linked exclusively against system glibc/libstdc++/libm/libgcc_s (verified via ldd on Linux x86_64:
  zero ViennaRNA, zero GPL, zero AGPL libraries).
derived_assets_clean_room_rule: >
  Unpaired accessibility features and structural scores computed by EternaFold v1.3.1 carry zero ViennaRNA provenance and may be used
  directly in commercial_clean candidate ranking and downstream surrogate feature extraction.
commercial_replacement_paths:
  - "Unmodified / 5moU Secondary Structure Accessibility: EternaFold v1.3.1 --params EternaFoldParams.v1 --posteriors (BSD-3-Clause)."
  - "Modified m1Psi Native Reactivity: Route m1Psi constructs to RC-002 structRFM MIT m1Psi SHAPE-MaP probe (Spearman 0.5918 vs EternaFold 0.4077 / ViennaRNA 0.4142)."
frozen_benchmark_dataset_and_protocol: >
  Dual frozen shootout executed on Colab runtime g8-verify-l4 (2026-11-26T23:26:29Z): (1) Stanford RMDB ETERNA_R69_0000 1M7 chemical
  mapping (120 constructs, 9,480 evaluated nucleotides); (2) Moderna Mauger 2019 GSE139176 fLuc SHAPE-MaP across U (39 constructs,
  68,531 nt), 5moU (39 constructs, 68,225 nt), and m1Psi (39 constructs, 68,291 nt); (3) 40 supplemental 90-nt 5'UTR+CDS initiation
  windows (6 mRNAx fixture constructs + 34 seeded random windows under RNG seed 20261127, scoring mean unpaired probabilities across
  positions -15 through +17 relative to start AUG, i.e. Python slice [-15:+18]).
acceptance_metrics:
  - metric_id: "rmdb_eterna_r69_1m7_spearman_rho"
    definition_and_scale: "Per-nucleotide Spearman rank correlation between predicted unpaired probability and RMDB ETERNA_R69_0000 1M7 reactivity across 120 constructs (9,480 nt)"
    direction: "higher_is_better"
    frozen_baseline_reference: "ViennaRNA v2.8.0 McCaskill Spearman rho = 0.6747; EternaFold v1.3.1 measured rho = 0.6993 (delta = +0.0246, unpaired Pearson r = 0.8895)"
    max_acceptable_degradation: "Must achieve Spearman rho >= 0.6547 (within -0.020 of ViennaRNA v2.8.0 baseline)"
    measured_value: 0.6993
    numeric_min_bound: 0.6547
  - metric_id: "moderna_shapemap_unmodified_u_zeroshot_spearman"
    definition_and_scale: "Zero-shot per-nucleotide Spearman rho on Mauger 2019 unmodified-U fLuc SHAPE-MaP (39 constructs, 68,531 nt)"
    direction: "higher_is_better"
    frozen_baseline_reference: "ViennaRNA v2.8.0 zero-shot rho = 0.4517; EternaFold v1.3.1 measured rho = 0.4972 (delta = +0.0455; 5moU also +0.0544 at 0.4642 vs 0.4098)"
    max_acceptable_degradation: "Must achieve Spearman rho >= 0.4317 on unmodified U"
    measured_value: 0.4972
    numeric_min_bound: 0.4317
  - metric_id: "moderna_shapemap_m1psi_zeroshot_spearman"
    definition_and_scale: "Zero-shot per-nucleotide Spearman rho on Mauger 2019 m1Psi fLuc SHAPE-MaP (39 constructs, 68,291 nt)"
    direction: "higher_is_better"
    frozen_baseline_reference: "ViennaRNA v2.8.0 zero-shot rho = 0.4142; EternaFold v1.3.1 measured rho = 0.4077 (delta = -0.0065; m1Psi primary scorer remains RC-002 structRFM at 0.5918)"
    max_acceptable_degradation: "Zero-shot m1Psi Spearman rho >= 0.3942 (within -0.020 of ViennaRNA)"
    measured_value: 0.4077
    numeric_min_bound: 0.3942
  - metric_id: "construct_latency_ms_cpu"
    definition_and_scale: "Mean wall-clock folding latency in milliseconds per construct on RMDB ETERNA_R69_0000"
    direction: "lower_is_better"
    frozen_baseline_reference: "Measured EternaFold v1.3.1 latency = 25.3 ms/construct"
    max_acceptable_degradation: "Mean latency <= 250.0 ms/construct"
    measured_value: 25.3
    numeric_max_bound: 250.0
max_compute_cost_budget: "CPU-only C++ binary; <= 250 ms/construct (measured 25.3 ms/construct); zero GPU VRAM; zero commercial royalty."
overall_switch_rule: >
  Approve EternaFold v1.3.1 (BSD-3-Clause) as commercial_clean secondary-structure accessibility replacement for unmodified and 5moU
  RNA constructs whenever all four acceptance_metrics meet their explicit numeric bounds above and ldd confirms zero ViennaRNA linkage;
  route m1Psi constructs to RC-002 structRFM MIT m1Psi probe rather than uncalibrated thermodynamic posteriors.
rollback_version: "CommercialCleanSurrogateV1 pure-sequence k-mer LightGBM + RC-002 structRFM MIT SHAPE-MaP probe"
