component_name_and_version: "structRFM 0.0.9"
role_in_pipeline: >
  structRFM base pretrained BERT (PyPI code v0.0.9 / Zenodo 16754363 v0.0.3 deposit checkpoints/structRFM_checkpoint, MIT).
  Commercial-clean MIT-licensed RNA structure-guided foundation encoder (12-layer BERT, dim=768, max_length=514,
  loaded natively via HuggingFace AutoTokenizer/BertForMaskedLM with ZERO BPfold/GPL dependencies). Strictly routed to
  per-nucleotide chemistry-specific SHAPE-MaP reactivity prediction (U, 5moU, m1Psi on Mauger 2019 fLuc constructs)
  without ViennaRNA redistribution conflict; never 50/50-blended into 5'UTR MRL (where pure-sequence LightGBM is superior).
current_license_track: "commercial_clean"
code_rights_basis: >
  Official repository https://github.com/heqin-zhu/structRFM and PyPI structRFM==0.0.9 declare MIT License
  (Copyright 2025 Heqin Zhu). Inference in mRNAx loads model.safetensors directly through Apache-2.0 HuggingFace
  transformers without importing BPfold. Retain original copyright, license notice, and no-warranty disclaimer.
weights_rights_basis: >
  Zenodo record 16754363 (version v0.0.3, doi:10.5281/zenodo.16754363) checkpoints.tar.gz (2,244,264,123 bytes,
  verified MD5 e572a7781a8099ff45692fcd46f83043, SHA-256 b368e420f3d8d73fc91ba2939799862a6b5442dc02f4a7dfab18b19a0f59a567)
  carries record-level MIT License. Applies ONLY to these exact version- and hash-matched artifacts; does not extend to
  unmapped mirrors or third-party data/patents.
training_and_parameter_data_rights_basis: >
  Per C-W6 independent audit: pretraining, benchmark evaluation, and third-party datasets are recorded separately.
  RNAcentral carries its own independent license terms (https://docs.rnacentral.org/license.html) and is NOT relicensed
  by Zenodo record-level MIT. Downstream mRNAx probes are trained exclusively on CC-BY-4.0 / public-GEO datasets
  (GSE232927, GSE176581, eLife 45396, GSE173083, GSE139176); zero ViennaRNA labels used. Engineering provenance summary only.
runtime_dependency_rights_basis: >
  Standard PyTorch (2.14.1+cu130, BSD-3-Clause) + HuggingFace transformers (Apache-2.0) + scikit-learn (BSD-3-Clause)
  + joblib (BSD-3-Clause); zero GPL/AGPL or non-commercial dependencies.
derived_assets_clean_room_rule: >
  All downstream probes and fine-tuned checkpoints built on structRFM remain commercial_clean provided training labels
  originate solely from CC0/CC-BY-4.0/public-GEO or proprietary wet-lab assays and exclude ViennaRNA-distilled labels
  and non-commercial datasets/models (RiboNN, CodonBERT, GEMORNA, UTR-LM GPL).
commercial_replacement_paths:
  - "Primary Commercial-Clean Structure Backbone: Keep structRFM base (MIT) with chemistry-specific Ridge/LoRA heads for U, 5moU, and m1Psi SHAPE-MaP."
  - "Long-Context Full-Transcript Partner: Pair with RC-003 Orthrus 6-track (MIT, 2,048+ nt Mamba) for full-transcript consensus half-life."
frozen_benchmark_dataset_and_protocol: >
  Frozen 5-Lab Commercial-Clean OOD Suite v1 (Drive 1ORULrQfMmE64o478k5WrDJI2xOqv-Q4Z): strict GroupKFold OOD evaluation
  across GSE232927, Cao2021 GSE176581, Wu2019 eLife 45396, Leppek2022 GSE173083, and Mauger2019 GSE139176 (39 fLuc constructs x 3 chemistries).
acceptance_metrics:
  - metric_id: "moderna_shapemap_per_nt_spearman_m1psi"
    definition_and_scale: "Out-of-fold per-nucleotide Spearman rho on held-out Mauger 2019 Moderna m1Psi (mpU) fLuc SHAPE-MaP constructs ([-1, 1])"
    direction: "higher_is_better"
    frozen_baseline_reference: "ViennaRNA RNAplfold zero-shot global rho=0.4142 (per-construct median=0.4128); structRFM MIT probe measured rho=0.5918 (per-construct median=0.5947)"
    max_acceptable_degradation: "Must beat or match ViennaRNA RNAplfold within delta >= -0.020 on m1Psi (numeric_min_bound >= 0.3942)"
    measured_value: 0.5918
    numeric_min_bound: 0.3942
  - metric_id: "moderna_shapemap_chemistry_specificity_gain"
    definition_and_scale: "Spearman rho gain of native m1Psi (mpU) structRFM probe over zero-shot unmodified-U probe on paired Mauger 2019 m1Psi fLuc constructs"
    direction: "higher_is_better"
    frozen_baseline_reference: "Native mpU probe rho=0.5918 vs zero-shot U->mpU rho=0.5124 (gain = +0.0794)"
    max_acceptable_degradation: "Native m1Psi probe must exceed unmodified-U zero-shot transfer by delta >= +0.040 Spearman units"
    measured_value: 0.0794
    numeric_min_bound: 0.040
  - metric_id: "gpu_determinism_max_abs_diff"
    definition_and_scale: "Maximum absolute hidden-state difference across fixed-seed L4 inference passes"
    direction: "lower_is_better"
    frozen_baseline_reference: "Measured on NVIDIA L4: max_abs_diff = 0.0"
    max_acceptable_degradation: "max_abs_diff <= 0.0010"
    measured_value: 0.0
    numeric_max_bound: 0.001
  - metric_id: "gpu_l4_peak_vram_mb"
    definition_and_scale: "Peak allocated GPU memory in MB at batch_size=64 on NVIDIA L4"
    direction: "lower_is_better"
    frozen_baseline_reference: "Measured on NVIDIA L4: peak VRAM = 1,094.1 MB"
    max_acceptable_degradation: "peak VRAM <= 4,096.0 MB"
    measured_value: 1094.1
    numeric_max_bound: 4096.0
  - metric_id: "gpu_l4_latency_ms_per_seq"
    definition_and_scale: "Throughput latency in ms/seq at batch_size=64 on NVIDIA L4 GPU"
    direction: "lower_is_better"
    frozen_baseline_reference: "Measured on NVIDIA L4: latency = 0.69 ms/seq (1439.7 seq/s)"
    max_acceptable_degradation: "latency <= 15.0 ms/seq on L4/T4 GPU"
    measured_value: 0.69
    numeric_max_bound: 15.0
max_compute_cost_budget: "Peak VRAM <= 4,096 MB (measured 1094.1 MB on L4); inference <= 15 ms/seq batched on Colab L4/T4; zero commercial royalty."
overall_switch_rule: >
  Keep structRFM base (MIT) enabled in commercial_clean M1.5 scorer tier whenever all three acceptance_metrics stay
  within their explicit bounds above, zero GPL/non-commercial dependencies are introduced, and chemistry-specific
  probes are verified per track (U vs m1Psi).
rollback_version: "CommercialCleanSurrogateV1 pure-sequence LightGBM (zero GPU required)"
