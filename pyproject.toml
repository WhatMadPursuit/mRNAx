[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrnax"
version = "0.1.0"
description = "mRNAx v2: Industrial-grade, Clean-Room Commercial-Ready Agentic RNA Sequence Design Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - Private Repository" }
dependencies = [
    "pydantic>=2.9.0",
    "biopython>=1.84",
    "dnachisel>=3.2.15",
    "ViennaRNA>=2.6.4",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
mrnax = "mrnax.harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrnax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
