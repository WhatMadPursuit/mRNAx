[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrnax"
version = "0.1.0"
description = "mRNAx v2: Industrial-grade, Clean-Room Commercial-Ready Agentic RNA Sequence Design Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - Private Repository" }
dependencies = [
    "pydantic>=2.9.0",
    "biopython>=1.84",
    "dnachisel>=3.2.15",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
    "joblib>=1.4.0",
    "scikit-learn==1.6.1",
    "lightgbm>=4.5.0",
]

[project.optional-dependencies]
research = [
    "ViennaRNA>=2.6.4",
]
dev = [
    "ViennaRNA>=2.6.4",
    "pytest>=8.3.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
]
gpu = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
]

[project.scripts]
mrnax = "mrnax.harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrnax"]

[tool.hatch.build.targets.wheel.force-include]
"registry_seed" = "mrnax/_bundled_data/registry_seed"
"docs/replacement_cards" = "mrnax/_bundled_data/replacement_cards"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra -q"
